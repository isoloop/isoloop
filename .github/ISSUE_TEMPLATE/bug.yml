name: Bug report
description: Something in an Isoloop package doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      description: For example `@isoloop/host 0.1.0`. `npm ls @isoloop/host` shows it.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: The browser and its version, or the Node version.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: A link to a repo or a short snippet that shows it.
    validations:
      required: true
