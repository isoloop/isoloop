# ADR 0009, rule 12: Ubuntu only. Four jobs: `browser`, `e2e` (one per engine)
# and `bench` start after `check` passes. Actions are pinned by commit SHA
# (rule 9), tags in comments.
#
# What runs when (decided 2026-11-07):
# - pull requests: everything;
# - pushes to main: `check` only, since the PR already ran the rest;
# - release tags (`v<major>.<minor>.<patch>`, no suffix): everything (the M4 release job will follow it);
#   prerelease tags (`v0.1.0-next.N`) are records only and run nothing (ADR 0019);
# - weekly, Monday 05:00 UTC: everything, to catch flaky tests and drift.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Release tags only (ADR 0019, decision 6): `v0.1.0` matches, `v0.1.0-next.3`
    # doesn't. GitHub's filter must match the whole tag, and `.` is literal.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the base for docs:check: main's tip on a PR (HEAD is the
          # merge commit), the previous commit on a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:node
      - run: pnpm build
      - run: node scripts/check-exports.ts
      # The docs rules and the map's coverage of the built .d.ts (M4c decision 22).
      - run: pnpm docs:check
        env:
          DOCS_CHECK_BASE: HEAD^1
      # The API reference matches the built .d.ts and the CLI (M4c decision 27).
      - run: pnpm docs:api --check

  browser:
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The bus worker's tests run in all three engines (M2b); the rest in Chromium.
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium firefox webkit
      - run: pnpm test:browser

  e2e:
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: ${{ matrix.browser }}
      # Chromium also runs the WebMCP suite, with WebMCP's flag on (M4a decision 15).
      - run: pnpm e2e --project=${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--project=chromium-webmcp' || '' }} ${{ matrix.browser == 'firefox' && '--project=firefox-webmcp' || '' }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Report only (plan m1-kernel, task 13): no threshold yet. The numbers are in
  # the job log and in the bench-results artifact.
  bench:
    needs: check
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium firefox webkit
      - run: pnpm bench:click-to-paint
      - run: pnpm bench:throughput
      - run: pnpm bench:memory
      - run: pnpm bench:codec
      # Pooled against own workers (M2c task 9): memory and start-up of 20
      # headless isolates on all three engines, reported, not asserted.
      - run: pnpm bench:pools
        env:
          GATE_RUNS: '3'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/
          retention-days: 30
