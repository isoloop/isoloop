# ADR 0009, rule 12: Ubuntu only. Five jobs: `browser`, `e2e` (one per engine)
# and `bench` start after `check` passes; `cli-node24` runs beside `check`.
# Actions are pinned by commit SHA (rule 9), tags in comments.
#
# What runs when (ADR 0009, amended 2026-11-27):
# - pull requests: everything, unless the PR is docs-only: every changed file
#   is under `docs/` or `.changeset/` or `.claude/`, or ends in `.md`. Then
#   `check` runs in full and the other jobs report success without running
#   their steps, so the required checks still pass;
# - pushes to main and release/0.1: `check` and `cli-node24`, since the PR
#   already ran the rest;
# - dry runs and stage runs of release.yml, which call it: everything. A called
#   workflow sees its caller's event, so it's never docs-only. Tags run nothing;
# - nightly, 03:00 UTC on main: everything, called by nightly.yml, which skips
#   quiet nights and reports failures in an issue;
# - run by hand: everything.
name: CI

on:
  pull_request:
  push:
    branches: [main, release/0.1]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A run started by hand, a release's included, gets its own group, so main's
  # CI doesn't replace it.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this is a docs-only pull request: every changed file is docs, so the
  # jobs after `check` skip their steps. Only `pull_request` runs can be; release
  # runs (workflow_call), the nightly, pushes and runs by hand never are.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # HEAD is the merge commit and HEAD^1 main's tip, as in `check`.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          docs=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              docs=true
              while IFS= read -r f; do
                case "$f" in
                  docs/* | .changeset/* | .claude/* | *.md) ;;
                  *) docs=false; echo "not docs: $f"; break ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "docs-only: $docs"
          echo "docs-only=$docs" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the base for docs:check: main's tip on a PR (HEAD is the
          # merge commit), the previous commit on a push.
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The rules registry and its generated README (ADR 0026, decision 10).
      - run: pnpm rules:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:node
      - run: pnpm build
      - run: node scripts/check-exports.ts
      # Bundle budgets and the scripts' sideEffects (ADR 0021, decisions 6 and 7).
      - run: pnpm bench:bundle
      # The docs rules and the map's coverage of the built .d.ts (M4c decision 22).
      - run: pnpm docs:check
        env:
          DOCS_CHECK_BASE: HEAD^1
      # The API reference matches the built .d.ts and the CLI (M4c decision 27).
      - run: pnpm docs:api --check

  # The workspace builds and tests on Node 26 (.nvmrc). The published `isoloop`
  # CLI also supports Node 24 LTS (its `engines`), so run its tests and the
  # built CLI there.
  cli-node24:
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter isoloop... build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --version
      - run: ./node_modules/.bin/vitest run --project cli
      - run: |
          cli=packages/cli/dist/cli.js
          node $cli --version
          node $cli --help
          node $cli contracts export packages/cli/src/__fixtures__/contracts.ts > /dev/null 2> warnings.txt
          cat warnings.txt
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/$cli" skill add
          test -f .claude/skills/build-with-isoloop/SKILL.md

  browser:
    needs: [changes, check]
    if: github.event_name != 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The bus worker's tests run in all three engines (M2b); the rest in Chromium.
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium firefox webkit
      - run: pnpm test:browser

  # A matrix job skipped at the job level reports one unexpanded `e2e` check, and
  # the required `e2e (chromium)`, `e2e (firefox)` and `e2e (webkit)` would stay
  # pending. So on a docs-only PR the jobs run and skip their steps.
  e2e:
    needs: [changes, check]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
    steps:
      - if: env.DOCS_ONLY == 'true'
        run: echo "A docs-only pull request; e2e skipped."
      - if: env.DOCS_ONLY != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.DOCS_ONLY != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.DOCS_ONLY != 'true'
        run: pnpm install --frozen-lockfile
      - if: env.DOCS_ONLY != 'true'
        uses: ./.github/actions/install-browsers
        with:
          browsers: ${{ matrix.browser }}
      # Chromium also runs the WebMCP suite, with WebMCP's flag on (M4a decision 15).
      - if: env.DOCS_ONLY != 'true'
        run: pnpm e2e --project=${{ matrix.browser }} ${{ matrix.browser == 'chromium' && '--project=chromium-webmcp' || '' }} ${{ matrix.browser == 'firefox' && '--project=firefox-webmcp' || '' }}
      - if: failure() && env.DOCS_ONLY != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Report only (plan m1-kernel, task 13): no threshold yet. The numbers are in
  # the job log and in the bench-results artifact.
  bench:
    needs: [changes, check]
    if: github.event_name != 'push' && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: chromium firefox webkit
      - run: pnpm bench:click-to-paint
      - run: pnpm bench:throughput
      - run: pnpm bench:memory
      - run: pnpm bench:codec
      # Pooled against own workers (M2c task 9): memory and start-up of 20
      # headless isolates on all three engines, reported, not asserted.
      - run: pnpm bench:pools
        env:
          GATE_RUNS: '3'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/
          retention-days: 30
