# Publishes every public @isoloop/* package under the npm `next` dist-tag, at
# the version Changesets wrote on main (pre mode `next`: 0.1.0-next.N). The
# version step runs before this, as a PR: `pnpm release:version` bumps every
# package and writes the CHANGELOG.md sections (CONTRIBUTING.md, "Releases").
# npm trusts this workflow file for each package (trusted publishing), so there
# is no token: the job's OIDC token authenticates, and provenance is automatic.
# Once every package is on npm (published, or skipped as already there), the
# `tag` job tags the commit this run built `v<version>` (v0.1.0-next.N).
name: Prerelease

on:
  workflow_dispatch:

# Each job asks for what it needs: publish the OIDC token, tag the push.
permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1'); process.exit(1) }" "$(npm --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-exports.ts
      # Writes `version` to $GITHUB_OUTPUT once every package is on npm.
      - id: publish
        run: node scripts/prerelease.ts

  # An annotated tag `v<version>` on the commit `publish` built. Its own job, so
  # the write token never meets the install and build steps. A re-run finds
  # the tag on that commit and passes; on another commit it fails.
  #
  # Pushed with this job's GITHUB_TOKEN, the tag starts no workflow: GitHub
  # doesn't run workflows on events that token causes. M4d's release workflow
  # must still match only `v<major>.<minor>.<patch>` with no suffix (for
  # example `tags: ['v[0-9]+.[0-9]+.[0-9]+']`), so a `-next.N` tag never
  # releases.
  tag:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Tag v${{ needs.publish.outputs.version }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error title=Prerelease tag::publish wrote no version."
            exit 1
          fi
          tag="v${VERSION}"
          # 0: the tag exists; 2: it doesn't; anything else: ls-remote failed.
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null || found=$?
          if [ "${found}" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
            tagged="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [ "${tagged}" != "${COMMIT}" ]; then
              echo "::error title=Prerelease tag::${tag} already tags ${tagged}, not ${COMMIT}, the commit this run built."
              exit 1
            fi
            echo "${tag} already tags ${COMMIT}."
            exit 0
          fi
          if [ "${found}" -ne 2 ]; then exit "${found}"; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "${tag}" -m "${tag}" "${COMMIT}"
          git push origin "refs/tags/${tag}"
          echo "Tagged ${COMMIT} ${tag}."
