packages:
  - packages/*
  - packages/react/majors/*
  - examples/*
  - bench
  - e2e/harness

# Every tool version lives here, pinned exactly (ADR 0009, rule 8).
# Packages reference them with "catalog:".
catalog:
  '@msgpack/msgpack': 3.1.3
  '@playwright/test': 1.64.1
  '@types/node': 26.6.6
  '@vitest/browser-playwright': 5.0.5
  cbor-x: 1.6.9
  fast-check: 4.10.2
  msgpackr: 2.1.4
  oxfmt: 0.75.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  playwright: 1.64.1
  tsdown: 0.23.4
  typescript: 7.0.2
  valibot: 1.5.0
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7
  # Framework majors the adapters support (ADR 0010), one exact version per
  # major. Preact has no peers, so both majors sit in packages/preact under
  # npm: aliases. `@types/react*` follow the newest React major.
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  preact10: npm:preact@10.29.8
  preact11: npm:preact@11.1.1

# React's majors can't be aliases in one package: react-dom takes `react` as a
# peer, and one importer has one `react`. Each major gets a private package
# under packages/react/majors that installs it under its real names.
catalogs:
  react18:
    react: 18.3.1
    react-dom: 18.3.1
  react19:
    react: 19.3.1
    react-dom: 19.3.1

# Supply chain (ADR 0009, rule 9).
minimumReleaseAge: 4320 # minutes: refuse versions younger than 3 days
strictPeerDependencies: true
# Lifecycle scripts are blocked unless a package is listed here with `true`.
allowBuilds:
  # Native accelerators the codec bench's libraries pull in; off, because the
  # bus runs them in browsers, where only their JS paths exist.
  cbor-extract: false
  msgpackr-extract: false
strictDepBuilds: true
